[package]
name = "auction-demo-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "auction-demo-bridge"
path = "src/main.rs"

[dependencies]
# Pinned to a CADS-Tunnel tag (not vendored, not crates.io-published), same convention
# ct-agent's own Cargo.toml uses for the same crate: v0.4.0 already carries #227/#228
# (SelectionPolicy / auction_view) -- confirmed by diffing pipeline.rs between v0.4.0
# and current main before picking this tag (only clippy-only commits landed after it).
ct-common = { git = "https://github.com/scimbe/CADS-Tunnel", tag = "v0.4.0" }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
