# Self-service variant: deploys auction-demo on the workflow-maintainer portal
# account's own tunnel (auction-demo.bunsenbrenner.org) directly against the hosted
# bunsenbrenner.org plane, instead of the base compose.auction-demo.yml's assumption
# of an already-running LOCAL CADS-Tunnel plane (external `ct-selfhost_default`
# network, an operator-supplied AUCTION_CERT_DIR).
#
# Differences from the base compose.auction-demo.yml:
#   - no external `ct-selfhost_default` network requirement: this account's tunnel
#     connects out to the public bunsenbrenner.org:4433 edge over the network, the
#     same shape already proven by flappy-demo/cookbook-demo/webconference-demo's
#     own compose files, not by joining a local self-hosted plane's network.
#   - no operator-supplied AUCTION_CERT_DIR: this tunnel's certificate status is
#     already Grün (verified live: GET /agent/acme-admission/<token>/<hostname> ->
#     {"status":"gruen","may_issue_now":true}) -- confirmed via
#     docs/agent-onboarding.md "Certificate status: Rot/Gelb/Grün" and
#     docs/dns01-desec.md "Self-service agent certificates" (both in CADS-Tunnel).
#     The auction-demo-cert service below runs `ct-agent certificate` continuously
#     (self-renewing, per that doc) and writes fullchain.pem/privkey.pem to a
#     shared volume the origin mounts read-only -- the base Caddyfile (unmodified,
#     already expects exactly that path) serves real TLS on :443, matching how the
#     edge actually treats a Grün tunnel (SNI passthrough, no shared cert). A
#     Gelb-style plain-:80 variant (Caddyfile.selfservice, now unused) was tried
#     first and live-failed with a TLS handshake error ("wrong version number") --
#     the edge doesn't downgrade a Grün tunnel back to shared-cert termination.
#
#   docker compose -f compose.auction-demo.selfservice.yml --env-file .env.selfservice \
#     up --build -d
services:
  auction-demo-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8789"   # reached only by the origin's reverse_proxy on the compose network
    restart: unless-stopped

  # Six genuinely independent bidder processes -- unchanged from the base compose
  # file, see its own comment (src/bin/provider.rs, README's "What's real, what's
  # simulated") -- none of this needs the local-plane network or a real cert.
  auction-demo-provider-aurora:
    build: { context: ., dockerfile: Provider.Dockerfile }
    environment: [PROVIDER_NAME=aurora, PROVIDER_ROLE=reviewer, PROVIDER_UNITS=15, PROVIDER_PRICE=60, "BRIDGE_URL=http://auction-demo-bridge:8789"]
    depends_on: [auction-demo-bridge]
    restart: unless-stopped

  auction-demo-provider-borealis:
    build: { context: ., dockerfile: Provider.Dockerfile }
    environment: [PROVIDER_NAME=borealis, PROVIDER_ROLE=reviewer, PROVIDER_UNITS=12, PROVIDER_PRICE=45, "BRIDGE_URL=http://auction-demo-bridge:8789"]
    depends_on: [auction-demo-bridge]
    restart: unless-stopped

  auction-demo-provider-cascade:
    build: { context: ., dockerfile: Provider.Dockerfile }
    environment: [PROVIDER_NAME=cascade, PROVIDER_ROLE=reviewer, PROVIDER_UNITS=20, PROVIDER_PRICE=55, "BRIDGE_URL=http://auction-demo-bridge:8789"]
    depends_on: [auction-demo-bridge]
    restart: unless-stopped

  auction-demo-provider-delta:
    build: { context: ., dockerfile: Provider.Dockerfile }
    environment: [PROVIDER_NAME=delta, PROVIDER_ROLE=writer, PROVIDER_UNITS=25, PROVIDER_PRICE=30, "BRIDGE_URL=http://auction-demo-bridge:8789"]
    depends_on: [auction-demo-bridge]
    restart: unless-stopped

  auction-demo-provider-echo:
    build: { context: ., dockerfile: Provider.Dockerfile }
    environment: [PROVIDER_NAME=echo, PROVIDER_ROLE=writer, PROVIDER_UNITS=30, PROVIDER_PRICE=38, "BRIDGE_URL=http://auction-demo-bridge:8789"]
    depends_on: [auction-demo-bridge]
    restart: unless-stopped

  auction-demo-provider-foxtrot:
    build: { context: ., dockerfile: Provider.Dockerfile }
    environment: [PROVIDER_NAME=foxtrot, PROVIDER_ROLE=writer, PROVIDER_UNITS=28, PROVIDER_PRICE=22, "BRIDGE_URL=http://auction-demo-bridge:8789"]
    depends_on: [auction-demo-bridge]
    restart: unless-stopped

  auction-demo-origin:
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - auction_demo_certs_ss:/certs:ro
      - auction_demo_caddy_data_ss:/data
    expose:
      - "443"
    depends_on:
      - auction-demo-bridge
      - auction-demo-cert
    restart: unless-stopped

  # Self-service real certificate (ADR-0003, CADS-Tunnel docs/dns01-desec.md
  # "Self-service agent certificates") -- this tunnel is already Grün, so this
  # issues near-immediately rather than waiting on the admission broker's queue,
  # then keeps renewing on its own. Reuses the same ct-agent image as the
  # browser-plane agent below (same binary, different subcommand).
  auction-demo-cert:
    build:
      context: .
      dockerfile: Agent.Dockerfile
      args:
        # Bumped 2026-08-19 to v0.5.7 (CADS-Tunnel#587): the previous pin had
        # silently drifted 77 commits/~6 days behind ct-agent main.
        - CT_AGENT_REF=${CT_AGENT_REF:-v0.5.7}
    environment:
      - CT_AGENT_CP_URL=${AUCTION_AGENT_CP_URL:?control-plane URL}
      - CT_AGENT_TOKEN=${AUCTION_AGENT_TOKEN:?this tunnel's routing token, from the portal Install page}
      - CT_AGENT_HOSTNAME=auction-demo.bunsenbrenner.org
      - CT_ACME_CERT_OUT_DIR=/certs
      # ct-agent certificate is silent at default verbosity -- RUST_LOG=debug is
      # what surfaced the real progress (DNS-01 TXT lookups, ACME order state)
      # while diagnosing the IPv6-network-fix below; override back to debug here
      # if a future renewal/issuance ever needs the same visibility.
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - auction_demo_certs_ss:/certs
    command: ["ct-agent", "certificate"]
    restart: unless-stopped

  auction-demo-agent:
    build:
      context: .
      dockerfile: Agent.Dockerfile
      args:
        # Keep in sync with CADS-webconference-demo/Agent.Dockerfile and
        # CADS-flappy-demo/Agent.Dockerfile's own CT_AGENT_REF (note:
        # webconference-demo now runs elsewhere, not redeployed from here).
        # Bumped 2026-08-19 to v0.5.7 (CADS-Tunnel#587): the previous pin had
        # silently drifted 77 commits/~6 days behind ct-agent main -- pulls in
        # ct-agent#35/#41 (Noise-key attestation).
        - CT_AGENT_REF=${CT_AGENT_REF:-v0.5.7}
    environment:
      - CT_AGENT_MODE=browser
      - CT_AGENT_HOSTNAME=auction-demo.bunsenbrenner.org
      - CT_AGENT_TOKEN=${AUCTION_AGENT_TOKEN:?this tunnel's routing token, from the portal Install page}
      - CT_AGENT_ORIGIN=auction-demo-origin:443
      - CT_AGENT_ORIGIN_PROTO=tcp
      - CT_AGENT_CAPABILITY_OUT=/tmp/capability.bin
      - CT_AGENT_EDGE=${AUCTION_AGENT_EDGE:?edge host:port, e.g. bunsenbrenner.org:4433}
      # Needed regardless of Gelb/Grün status, contrary to this var's name and this
      # repo's earlier (wrong) assumption -- flappy-demo/webconference-demo's own
      # already-Grün agents set this too and need it to leave the edge; without it
      # this agent hangs forever on "waiting for edge cert at /shared/edge-cert.der"
      # (live-reproduced) instead of fetching the edge's own cert over HTTPS.
      - CT_AGENT_EDGE_CERT_URL=${AUCTION_AGENT_EDGE_CERT_URL:?fetches the edge's own cert}
      - CT_AGENT_CP_URL=${AUCTION_AGENT_CP_URL:?control-plane URL for onboarding}
      - CT_AGENT_JOIN_TOKEN=${AUCTION_JOIN_TOKEN:?single-use join token from the portal Install page}
      - CT_AGENT_ID=auction-demo-selfservice
      # Restart-safe onboarding: persist the bound identity so a container restart
      # restores it instead of re-redeeming the single-use join token.
      - CT_AGENT_STATE_DIR=/var/lib/ct-agent
      - CT_AGENT_RECONNECT_MAX_ATTEMPTS=0
    volumes:
      - auction_demo_agent_state_ss:/var/lib/ct-agent
    depends_on:
      - auction-demo-origin
    command: ["ct-agent", "onboard"]
    restart: unless-stopped

networks:
  default:
    name: auction-demo-selfservice_default
    # ct-agent certificate's DNS-01 propagation self-check queries one of
    # bunsenbrenner.org's real nameservers over IPv6 -- Docker's default bridge
    # network has no IPv6 route at all, so that query permanently failed
    # ("Network is unreachable") and the check looped forever, never reaching
    # Let's Encrypt validation (live-diagnosed: RUST_LOG=debug showed the same
    # TXT lookup repeating every few seconds with the IPv6 nameserver attempt
    # always erroring). Confirmed the docker daemon supports IPv6 bridge
    # networks + NAT out of the box (a throwaway test network reached a real
    # IPv6 site) -- enabling it here is scoped to just this compose project,
    # no daemon-wide config touched.
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.31.253.0/24
        - subnet: fd00:ac71:0075::/64

volumes:
  auction_demo_caddy_data_ss:
  auction_demo_agent_state_ss:
  auction_demo_certs_ss:
