<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auftrag ausschreiben</title>
<meta name="description" content="Sechs unabhängige Anbieter bieten live auf deinen Auftrag. Ein echter Auktions-Algorithmus vergibt ihn und du siehst warum.">
<style>
 :root{
  --bg:#0c111d; --panel:#141b2c; --panel2:#1a2338; --line:#2a3450;
  --text:#eef1f7; --muted:#a3abc2; --accent:#d98a4f; --on-accent:#20130a; --ok:#5fb8ab; --warn:#e8b04f; --bar:#3a4668; --bar-win:#5fb8ab;
 }
 @media (prefers-color-scheme: light){
  :root{ --bg:#f5f7fb; --panel:#fff; --panel2:#eef1f8; --line:#c9d1e3; --text:#131a2c; --muted:#4d566b; --accent:#b8672f; --on-accent:#fff; --ok:#1f6f63; --warn:#8a5a00; --bar:#b9c3dc; --bar-win:#2f8a7d; }
 }
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
 .wrap{max-width:44rem;margin:0 auto;padding:1rem 1rem 3rem}
 .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem;color:var(--muted);font-size:.9rem}
 .lang button{font:inherit;background:none;border:1px solid var(--line);color:var(--muted);padding:.35rem .7rem;min-height:2.5rem;min-width:2.75rem;cursor:pointer}
 .lang button:first-child{border-radius:6px 0 0 6px}.lang button:last-child{border-radius:0 6px 6px 0;border-left:0}
 .lang button[aria-pressed=true]{background:var(--panel2);color:var(--text);font-weight:600}
 h1{font-size:clamp(1.5rem,6vw,2rem);line-height:1.2;margin:1.2rem 0 .4rem}
 .sub{margin:0;color:var(--muted)}
 .chip{display:inline-flex;align-items:center;gap:.4rem;margin-top:.8rem;font-size:.9rem;color:var(--muted)}
 .dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--muted)}
 .chip.up .dot{background:var(--ok)}
 form,.step,.final,.err{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1rem;margin-top:1.2rem}
 label,legend{display:block;font-weight:600;margin-bottom:.3rem}
 textarea,input[type=number]{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.6rem .7rem}
 textarea{min-height:8.5rem;resize:vertical}
 .row{display:flex;gap:1rem;align-items:end;flex-wrap:wrap;margin-top:.9rem}
 .row .f{flex:0 0 8rem}
 button.go{font:inherit;font-weight:700;background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:.8rem 1.2rem;min-height:2.75rem;cursor:pointer;flex:1 1 12rem}
 button.go[disabled]{opacity:.6;cursor:progress}
 :focus-visible{outline:3px solid var(--ok);outline-offset:2px}
 details{margin-top:.9rem;color:var(--muted);font-size:.92rem}
 summary{cursor:pointer;min-height:2.5rem;display:flex;align-items:center}
 details label{display:flex;gap:.5rem;align-items:center;font-weight:400;margin:0;min-height:2.5rem;color:var(--text)}
 fieldset{border:0;margin:0;padding:0}
 .step h2{font-size:1.05rem;margin:0 0 .6rem}
 .step h2 span{color:var(--muted);font-weight:400}
 ul.bids{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
 .bid{border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
 .bid.in{opacity:1;transform:none}
 .bid .l1{display:flex;justify-content:space-between;gap:.5rem;font-weight:600}
 .bid .meta{font-size:.82rem;color:var(--muted)}
 .bar{height:.5rem;border-radius:4px;background:var(--panel2);margin:.35rem 0;overflow:hidden}
 .bar i{display:block;height:100%;width:0;background:var(--bar);transition:width .5s}
 .bid.win{border-color:var(--ok);border-width:2px;background:var(--panel2)}
 .bid.win .bar i{background:var(--bar-win)}
 .bid.lose{opacity:.65}
 .bid.out{opacity:.5}.bid.out .l1 b{text-decoration:line-through}
 .badge{color:var(--ok);font-weight:700}
 .why{margin:.7rem 0 0;font-weight:600}
 .exec{margin-top:.7rem;border-top:1px dashed var(--line);padding-top:.6rem;font-size:.95rem}
 blockquote{margin:.4rem 0;padding:.4rem .8rem;border-left:3px solid var(--ok);background:var(--panel2);border-radius:0 6px 6px 0}
 .checks{list-style:none;margin:.3rem 0;padding:0}.checks li{margin:.15rem 0}
 .ok{color:var(--ok);font-weight:700}.hint{color:var(--warn);font-weight:700}
 .sig{font-size:.85rem;color:var(--muted)}
 .final{border-color:var(--ok)}.final p{margin:.2rem 0}
 .err{border-color:var(--warn)}
 .nobid{color:var(--muted);font-size:.9rem;margin:.4rem 0 0}
 footer{margin-top:2rem;color:var(--muted);font-size:.85rem}
 footer a{color:inherit}
 .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
 @media (prefers-reduced-motion: reduce){ .bid,.bar i{transition:none} }
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><span>Bunsenbrenner.org / auction-demo</span>
  <span class="lang" role="group" aria-label="Sprache / Language"><button type="button" data-l="de" aria-pressed="true">DE</button><button type="button" data-l="en" aria-pressed="false">EN</button></span></div>
 <h1 data-t="h1"></h1>
 <p class="sub" data-t="sub"></p>
 <div class="chip" id="chip" role="status"><span class="dot" aria-hidden="true"></span><span id="chip-t"></span></div>

 <form id="form">
  <label for="text" data-t="task"></label>
  <textarea id="text" maxlength="2000" required></textarea>
  <div class="row">
   <div class="f"><label for="budget" data-t="budget"></label><input id="budget" type="number" min="1" max="10000" value="100" inputmode="numeric" required></div>
   <button class="go" id="go" type="submit" data-t="go"></button>
  </div>
  <details><summary data-t="rule"></summary>
   <fieldset><legend class="sr" data-t="rule"></legend>
    <label><input type="radio" name="policy" value="lowest_floor" checked><span data-t="p_lowest_floor"></span></label>
    <label><input type="radio" name="policy" value="round_robin"><span data-t="p_round_robin"></span></label>
    <label><input type="radio" name="policy" value="least_calls"><span data-t="p_least_calls"></span></label>
   </fieldset></details>
 </form>

 <div id="out" aria-live="polite"></div>

 <footer>
  <details><summary data-t="real"></summary><p data-t="real_body"></p></details>
  <p><a href="https://github.com/scimbe/CADS-auction-demo">GitHub</a></p>
 </footer>
</div>
<script>
(() => {
 const T = {
  de: {
   h1: "Wer erledigt deinen Auftrag am besten?",
   sub: "Sechs unabhängige Anbieter bieten live. Der Algorithmus vergibt – du siehst warum.",
   task: "Dein Auftrag: Text kürzen und gegenlesen lassen", budget: "Budget (Credits)", go: "Auftrag ausschreiben", going: "Läuft …",
   rule: "Auswahlregel ändern", p_lowest_floor: "Günstigster Preis", p_round_robin: "Reihum (fair verteilt)", p_least_calls: "Wenigste Aufträge bisher",
   online: (u, n) => `${u} von ${n} Anbietern online`, offline: "Anbieter nicht erreichbar",
   step_writer: "Schreiben", step_reviewer: "Prüfen", cr: "Credits", done_n: (n) => `${n} erledigt`,
   asking: "Anbieter werden angefragt …", over: "über Budget", nobid: (w, r) => `${w}: keine Antwort (${r})`, win: "Gewinner",
   w_lowest_floor: (w, c, nx) => nx ? `${w} gewinnt: am günstigsten (${c} statt ${nx.price} bei ${nx.who}).` : `${w} gewinnt: einziger Bieter.`,
   w_round_robin: (w, p) => p ? `${w} ist dran: Reihum nach ${p}.` : `${w} ist dran: Reihum beginnt hier.`,
   w_least_calls: (w, j) => `${w} gewinnt: bisher am wenigsten Aufträge (${j}).`,
   works: (w) => `${w} arbeitet …`, summary: "Kurzfassung", words: (a, b) => `${a} → ${b} Wörter`,
   c_short: (p) => `Kürzer um ${p} %`, c_short_bad: "Nicht kürzer als das Original",
   c_num: "Alle Zahlen übernommen", c_num_bad: (l) => `Zahl fehlt in der Kurzfassung: ${l}`,
   c_len: (n) => `Sätze kurz genug (längster: ${n} Wörter)`, c_len_bad: (n) => `Ein Satz ist lang (${n} Wörter)`,
   verdict_ok: "Prüfbericht: in Ordnung", verdict_hint: "Prüfbericht: mit Hinweisen", signed: (w) => `Ergebnis von ${w} signiert, Signatur geprüft`,
   fin: (p, b) => `Fertig: ${p} von ${b} Credits.`, fin2: (w, t) => `Rechenzeit der Gewinner ${w} ms, gesamt ${t} ms.`,
   e_budget: (n, b) => `Mit ${b} Credits geht es nicht: das günstigste Gespann kostet ${n}.`, e_unfilled: (r) => `Für „${r}“ hat gerade niemand geboten.`,
   e_busy: "Gerade ist viel los. Bitte gleich noch einmal.", e_net: "Verbindung unterbrochen.", e_cut: "Die Ausschreibung endete ohne Ergebnis.", e_exec: (w) => `${w} konnte nicht liefern.`, e_sig: (w) => `Signatur von ${w} ungültig, Ergebnis verworfen.`,
   real: "Wie echt ist das?",
   real_body: "Jeder Anbieter ist ein eigener Prozess mit eigenem Schlüssel und signiert sein Gebot. Den Gewinner bestimmt CADS-Tunnel (ct_common::pipeline, auction_view). Gewichtet wird nur, was der Algorithmus kennt: Preis, Reihum oder bisherige Aufträge. Der Gewinner führt den Auftrag wirklich aus und signiert das Ergebnis. Die kurze Pause zwischen den Karten ist nur Anzeige.",
   sample: "Die Stadt baut bis 2030 am Hafen 1200 neue Wohnungen. Die Wohnungen sollen auch Menschen mit kleinem Einkommen offenstehen. Gestern war das Wetter schön und viele Menschen gingen spazieren. Für die Wohnungen investiert die Stadt 45 Millionen Euro. Ein Drittel der Wohnungen soll sozial gefördert werden."
  },
  en: {
   h1: "Who should do your job?",
   sub: "Six independent providers bid live. The algorithm awards it – and you see why.",
   task: "Your job: shorten a text and have it proofread", budget: "Budget (credits)", go: "Put job out to tender", going: "Running …",
   rule: "Change selection rule", p_lowest_floor: "Lowest price", p_round_robin: "Round robin (fair turns)", p_least_calls: "Fewest jobs so far",
   online: (u, n) => `${u} of ${n} providers online`, offline: "Providers unreachable",
   step_writer: "Write", step_reviewer: "Review", cr: "credits", done_n: (n) => `${n} done`,
   asking: "Asking the providers …", over: "over budget", nobid: (w, r) => `${w}: no answer (${r})`, win: "Winner",
   w_lowest_floor: (w, c, nx) => nx ? `${w} wins: lowest price (${c} instead of ${nx.price} from ${nx.who}).` : `${w} wins: only bidder.`,
   w_round_robin: (w, p) => p ? `${w}'s turn: round robin after ${p}.` : `${w}'s turn: round robin starts here.`,
   w_least_calls: (w, j) => `${w} wins: fewest jobs so far (${j}).`,
   works: (w) => `${w} is working …`, summary: "Short version", words: (a, b) => `${a} → ${b} words`,
   c_short: (p) => `${p}% shorter`, c_short_bad: "Not shorter than the original",
   c_num: "All numbers kept", c_num_bad: (l) => `Number missing from the short version: ${l}`,
   c_len: (n) => `Sentences short enough (longest: ${n} words)`, c_len_bad: (n) => `One sentence is long (${n} words)`,
   verdict_ok: "Review: all good", verdict_hint: "Review: with remarks", signed: (w) => `Result signed by ${w}, signature verified`,
   fin: (p, b) => `Done: ${p} of ${b} credits.`, fin2: (w, t) => `Winners' compute time ${w} ms, total ${t} ms.`,
   e_budget: (n, b) => `Not possible with ${b} credits: the cheapest pair costs ${n}.`, e_unfilled: (r) => `Nobody is bidding for "${r}" right now.`,
   e_busy: "Busy right now. Please try again in a moment.", e_net: "Connection lost.", e_cut: "The tender ended without a result.", e_exec: (w) => `${w} could not deliver.`, e_sig: (w) => `Signature from ${w} invalid, result discarded.`,
   real: "How real is this?",
   real_body: "Each provider is its own process with its own key and signs its bid. CADS-Tunnel decides the winner (ct_common::pipeline, auction_view). Only what the algorithm knows is weighed: price, round robin, or past jobs. The winner really does the job and signs the result. The short pause between cards is display only.",
   sample: "By 2030 the city will build 1200 new apartments at the harbour. The apartments should also be open to people with low incomes. Yesterday the weather was lovely and many people went for a walk. The city is investing 45 million euros in the apartments. One third of the apartments will receive social funding."
  }
 };
 const $ = (s) => document.querySelector(s);
 const out = $("#out"), form = $("#form"), go = $("#go"), ta = $("#text");
 let lang = (localStorageGet("lang") || (navigator.language || "de")).slice(0, 2) === "en" ? "en" : "de";
 let sampleShown = true, rosterState = null;
 function localStorageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
 function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
 const t = (k, ...a) => { const v = T[lang][k]; return typeof v === "function" ? v(...a) : v; };

 function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) { if (k === "class") e.className = v; else e.setAttribute(k, v); }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
 }
 const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

 function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((e) => { e.textContent = t(e.dataset.t); });
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
  if (sampleShown) ta.value = t("sample");
  go.textContent = t(go.disabled ? "going" : "go");
  renderRoster();
 }
 document.querySelector(".lang").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  lang = b.dataset.l; localStorageSet("lang", lang); applyLang();
 });
 ta.addEventListener("input", () => { sampleShown = false; });

 function renderRoster() {
  const chip = $("#chip");
  if (!rosterState) { chip.classList.remove("up"); $("#chip-t").textContent = t("offline"); return; }
  chip.classList.toggle("up", rosterState.up > 0);
  $("#chip-t").textContent = rosterState.up > 0 ? t("online", rosterState.up, rosterState.total) : t("offline");
 }
 async function loadRoster() {
  try { const r = await fetch("/roster"); if (!r.ok) throw 0; rosterState = await r.json(); } catch { rosterState = null; }
  renderRoster();
 }

 // ---- run one tender ----
 const sleep = (ms) => new Promise((r) => setTimeout(r, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : ms));
 let steps, finalEl, notes;

 function stepEl(role, n) {
  const list = h("ul", { class: "bids" });
  const why = h("p", { class: "why" });
  const exec = h("div", { class: "exec", hidden: "" });
  const el = h("section", { class: "step", "aria-labelledby": "h-" + role }, h("h2", { id: "h-" + role }, `${n} · ${t("step_" + role)}`), list, why, exec);
  out.append(el);
  return { role, el, list, why, exec, items: new Map(), max: 0 };
 }
 function setBar(item, price, max) { item.querySelector(".bar i").style.width = Math.max(6, Math.round((price / max) * 100)) + "%"; }

 async function onEvent(m) {
  switch (m.type) {
   case "tender": break;
   case "bid": {
    const s = steps[m.role]; if (!s) break;
    s.max = Math.max(s.max, m.price, 1);
    const item = h("li", { class: "bid" },
     h("div", { class: "l1" }, h("b", {}, cap(m.who)), h("span", {}, `${m.price} ${t("cr")}`)),
     h("div", { class: "bar", "aria-hidden": "true" }, h("i")),
     h("div", { class: "meta" }, `${t("done_n", m.jobs_done)} · ${m.ms} ms`));
    s.list.append(item); s.items.set(m.who, { item, price: m.price });
    await sleep(40); item.classList.add("in");
    for (const v of s.items.values()) setBar(v.item, v.price, s.max);
    await sleep(160); break;
   }
   case "no_bid": {
    notes.append(h("p", { class: "nobid" }, t("nobid", cap(m.who), m.reason))); break;
   }
   case "over_budget": {
    const e = steps[m.role].items.get(m.who);
    if (e) { e.item.classList.add("out"); e.item.querySelector(".meta").textContent = t("over"); }
    break;
   }
   case "cleared": {
    const s = steps[m.role]; const w = m.bids.find((b) => b.win);
    for (const b of m.bids) {
      const e = s.items.get(b.who); if (!e) continue;
      e.item.classList.add(b.win ? "win" : "lose");
      if (b.win) { e.item.querySelector(".l1 b").after(h("span", { class: "badge" }, " ✓ " + t("win"))); }
    }
    const W = cap(w.who), r = m.why;
    const nx = r.next ? { who: cap(r.next.who), price: r.next.price } : null;
    s.why.textContent = r.kind === "round_robin" ? t("w_round_robin", W, r.previous && cap(r.previous))
      : r.kind === "least_calls" ? t("w_least_calls", W, r.jobs) : t("w_lowest_floor", W, w.price, nx);
    await sleep(500); break;
   }
   case "exec_start": {
    const s = steps[m.role]; s.exec.hidden = false; s.exec.textContent = t("works", cap(m.who)); await sleep(300); break;
   }
   case "exec_done": {
    const s = steps[m.role], o = m.output; s.exec.textContent = "";
    if (m.role === "writer") {
     s.exec.append(h("strong", {}, t("summary")), h("blockquote", {}, o.summary), h("div", { class: "meta" }, t("words", o.words_in, o.words_out)));
    } else {
     const li = (ok, good, bad) => h("li", {}, h("span", { class: ok ? "ok" : "hint", "aria-hidden": "true" }, ok ? "✓ " : "! "), ok ? good : bad);
     s.exec.append(h("strong", {}, t(o.verdict === "ok" ? "verdict_ok" : "verdict_hint")), h("ul", { class: "checks" },
      li(o.shorter_ok, t("c_short", o.reduction_pct), t("c_short_bad")),
      li(o.numbers_ok, t("c_num"), t("c_num_bad", o.missing_numbers.join(", "))),
      li(o.sentence_length_ok, t("c_len", o.longest_sentence_words), t("c_len_bad", o.longest_sentence_words))));
    }
    s.exec.append(h("div", { class: "sig" }, "🔏 " + t("signed", cap(m.who)))); await sleep(300); break;
   }
   case "done":
    finalEl = h("section", { class: "final" }, h("p", {}, h("strong", {}, t("fin", m.total_price, m.budget))), h("p", { class: "meta" }, t("fin2", m.work_ms, m.total_ms)));
    out.append(finalEl); break;
   case "error": {
    const msg = m.code === "budget" ? t("e_budget", m.need, m.budget) : m.code === "unfilled" ? t("e_unfilled", m.role ? t("step_" + m.role) : "") : m.code === "bad_signature" ? t("e_sig", cap(m.who)) : t("e_exec", cap(m.who || ""));
    out.append(h("p", { class: "err", role: "alert" }, msg)); break;
   }
  }
 }

 form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  go.disabled = true; go.textContent = t("going"); out.textContent = "";
  steps = { writer: stepEl("writer", 1), reviewer: stepEl("reviewer", 2) };
  notes = h("div", {}); out.append(notes);
  steps.writer.why.textContent = t("asking");
  let finished = false;
  const body = { text: ta.value, budget: parseInt($("#budget").value, 10) || 0, policy: form.elements.policy.value };
  try {
   const r = await fetch("/tender", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
   if (!r.ok) { out.textContent = ""; out.append(h("p", { class: "err", role: "alert" }, r.status === 429 ? t("e_busy") : await r.text())); return; }
   steps.writer.why.textContent = "";
   const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "", queue = Promise.resolve();
   for (;;) {
    const { done, value } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i; while ((i = buf.indexOf("\n\n")) >= 0) {
     const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
     const line = chunk.split("\n").find((l) => l.startsWith("data:")); if (!line) continue;
     let m; try { m = JSON.parse(line.slice(5)); } catch { continue; }
     if (m.type === "done" || m.type === "error") finished = true;
     queue = queue.then(() => onEvent(m)); // display in arrival order, with a short pause
    }
   }
   await queue;
   if (!finished) out.append(h("p", { class: "err", role: "alert" }, t("e_cut")));
  } catch { out.append(h("p", { class: "err", role: "alert" }, t("e_net"))); }
  finally { go.disabled = false; go.textContent = t("go"); loadRoster(); }
 });

 applyLang(); loadRoster(); setInterval(() => { if (!go.disabled && !document.hidden) loadRoster(); }, 30000);
})();
</script>
</body>
</html>
