# Demo: serve https://auction-demo.bunsenbrenner.org through the Browser Plane, with
# a real Let's Encrypt certificate obtained at the origin via deSEC DNS-01 (issued
# CORE-side, relayed in -- see README).
#
# Runs ALONGSIDE an already-running CADS-Tunnel plane (ct-edge with
# CT_EDGE_BROWSER_LISTEN=:443 and a ct-control-plane the agent onboards against).
# Adapt AUCTION_AGENT_EDGE/AUCTION_AGENT_CP_URL to your plane.
#
#   docker compose -f compose.auction-demo.yml --env-file .env up --build -d
#
# Local-only smoke test (no tunnel, no cert, just the bridge + dashboard) -- do NOT use
# `docker compose up <one-service>` here: Compose interpolates every service's env vars
# up front, including the other two services' required AUCTION_CERT_DIR/AUCTION_AGENT_EDGE/
# etc., so it fails before a single-service `up` even starts (verified). Build/run the
# bridge directly instead -- see README's "Running it locally" section.
services:
  auction-demo-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8789:8789"   # only for the local-only smoke test above; the public path goes through Caddy/the agent
    restart: unless-stopped

  auction-demo-origin:
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${AUCTION_CERT_DIR:?set AUCTION_CERT_DIR=<dir with fullchain.pem+privkey.pem from the operator>}:/certs:ro
      - auction_demo_caddy_data:/data
    expose:
      - "443"   # reachable only via the tunnel/agent, not published to the host
    depends_on:
      - auction-demo-bridge
    restart: unless-stopped

  auction-demo-agent:
    build:
      context: .
      dockerfile: Agent.Dockerfile
      args:
        - CT_AGENT_REF=${CT_AGENT_REF:-3a53877407cd4f72b9afa32b748549297f43732b}
    environment:
      - CT_AGENT_MODE=browser
      - CT_AGENT_HOSTNAME=auction-demo.bunsenbrenner.org
      - CT_AGENT_TOKEN=${AUCTION_AGENT_TOKEN:-}
      - CT_AGENT_ORIGIN=auction-demo-origin:443
      - CT_AGENT_ORIGIN_PROTO=tcp
      - CT_AGENT_CAPABILITY_OUT=/tmp/capability.bin
      - CT_AGENT_EDGE=${AUCTION_AGENT_EDGE:?edge host:port, e.g. edge:4433}
      - CT_AGENT_CP_URL=${AUCTION_AGENT_CP_URL:?control-plane URL for onboarding}
      - CT_AGENT_JOIN_TOKEN=${AUCTION_JOIN_TOKEN:?single-use join token}
      - CT_AGENT_ID=auction-demo
      - CT_AGENT_EDGE_CERT_URL=${AUCTION_AGENT_EDGE_CERT_URL:-}
      # Restart-safe onboarding: persist the bound identity so a container restart
      # restores it instead of re-redeeming the single-use join token (same fix
      # help-site needed for #141).
      - CT_AGENT_STATE_DIR=/var/lib/ct-agent
      - CT_AGENT_RECONNECT_MAX_ATTEMPTS=0
    command: ["ct-agent", "onboard"]
    depends_on:
      - auction-demo-origin
    restart: unless-stopped
    volumes:
      - auction_demo_agent_state:/var/lib/ct-agent

volumes:
  auction_demo_caddy_data:
  auction_demo_agent_state:

# Join the running plane's network so auction-demo-agent can reach the edge/control-
# plane hostnames used in AUCTION_AGENT_EDGE/AUCTION_AGENT_CP_URL above. Without this
# the compose creates its own isolated network and the agent can't reach the plane.
# Point this at whatever network name your plane's compose actually created.
networks:
  default:
    name: ${PLANE_NETWORK:-ct-selfhost_default}
    external: true
